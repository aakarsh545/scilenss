<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Smash planets, fling moons, drop black holes. Newtonian gravity with Jet Propulsion Laboratory masses."
    />
    <meta name="theme-color" content="#090a0d" />
    <title>Orbital gravity</title>
    <link rel="stylesheet" href="./orbit.css" />
  </head>
  <body>
    <a class="skip-link" href="#controls">Skip to controls</a>
    <canvas id="field" aria-label="Gravity field. Drag to place the selected body and set its velocity."></canvas>
    <div class="vignette" aria-hidden="true"></div>
    <h1 class="sr-only" id="title">Orbital</h1>
    <p class="empty" id="empty" hidden>Pick a rock, then fling it at a world.</p>

    <header class="play">
      <button id="pause" class="play__pause" type="button" aria-pressed="false" aria-label="Pause" data-state="pause">
        <span class="icon-pause" aria-hidden="true"><i></i><i></i></span>
        <span class="icon-play" aria-hidden="true"></span>
      </button>
      <div class="play__center">
        <button id="warp-toggle" class="play__clock" type="button" aria-expanded="false" aria-controls="warp-menu">
          <span id="sim-time">0 seconds</span>
          <span class="play__rate"><span id="rate">20 days / sec</span> · <span id="body-count">0</span></span>
        </button>
        <div class="warp" id="warp-menu" hidden role="group" aria-label="Time warp">
          <button type="button" data-scale="1">1 sec / sec</button>
          <button type="button" data-scale="60">1 min / sec</button>
          <button type="button" data-scale="3600">1 hour / sec</button>
          <button type="button" data-scale="86400">1 day / sec</button>
          <button type="button" data-scale="1728000">20 days / sec</button>
          <button type="button" data-scale="31557600">1 year / sec</button>
        </div>
        <p class="toast" id="status" role="status"></p>
      </div>
    </header>

    <section class="inspect" id="inspect" hidden aria-live="polite">
      <p class="inspect__kind" id="inspect-kind"></p>
      <h2 id="inspect-name">Earth</h2>
      <p class="inspect__model" title="Point masses and inverse-square gravity. The step size follows the free-fall time, separate from playback speed. Relativity, tides, and gravitational waves are off.">Newtonian mutual gravity</p>
      <dl>
        <div><dt>Speed</dt><dd id="speed">n/a</dd></div>
        <div><dt>Mass</dt><dd id="inspect-mass">1.00 Earth masses</dd></div>
        <div><dt>Radius</dt><dd id="inspect-size">6,371 km</dd></div>
        <div><dt title="Live ellipse about the strongest partner, computed from position and velocity">Orbit</dt><dd id="inspect-orbit">n/a</dd></div>
        <div><dt title="Osculating period about that partner">Period</dt><dd id="inspect-period">n/a</dd></div>
        <div><dt title="Relative energy error since the last spawn, throw, or collision. Collisions reset it because a merger removes energy.">dE/E</dt><dd id="drift">n/a</dd></div>
      </dl>
      <button id="inspect-more" class="inspect__more" type="button" aria-controls="sheet">All properties</button>
    </section>

    <section class="sheet" id="sheet" hidden role="dialog" aria-modal="false" aria-labelledby="sheet-title">
      <header class="sheet__head">
        <div>
          <h2 id="sheet-title">Physics registry</h2>
          <p class="sheet__coverage" id="sheet-coverage"></p>
        </div>
        <button id="sheet-close" type="button" aria-label="Close physics registry">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        </button>
      </header>
      <p class="sheet__scope" id="sheet-scope"></p>
      <div class="sheet__body" id="sheet-body"></div>
    </section>

    <div class="edge">
      <button id="physics" type="button" class="edge__sigma" aria-label="Physics registry" title="Physics registry" aria-expanded="false" aria-controls="sheet">Σ</button>
      <button id="fit" type="button" aria-label="Fit all bodies" title="Fit all bodies">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="trails" type="button" aria-pressed="true" aria-label="Trails" title="Trails">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M3 16c3-6 5 2 8 0s5-6 10-2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button id="clear" type="button" aria-label="Clear" title="Clear">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 7h14M9 7V5h6v2M8 7l1 13h6l1-13" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div class="account-slot">
        <button id="account-toggle" type="button" aria-expanded="false" aria-controls="account-menu" aria-label="Account">Me</button>
        <div class="account" id="account-menu" hidden>
          <form id="auth-form">
            <p class="account__hint">Sign in to save each project to your email.</p>
            <label for="auth-email">Email</label>
            <input id="auth-email" name="email" type="email" autocomplete="username" maxlength="254" required spellcheck="false" />
            <label for="auth-password">Password</label>
            <input id="auth-password" name="password" type="password" autocomplete="current-password" minlength="8" maxlength="200" required />
            <div class="account__actions">
              <button id="auth-submit" type="submit">Sign in</button>
              <button id="auth-create" type="button">Create account</button>
            </div>
            <p class="account__error" id="auth-error" role="alert"></p>
          </form>
          <div id="session" hidden>
            <p class="account__hint">Signed in as <strong id="session-email"></strong></p>
            <form id="project-form">
              <label for="project-name">Project name</label>
              <input id="project-name" name="project" type="text" maxlength="80" required placeholder="Sun and a flung Earth" />
              <div class="account__actions">
                <button type="submit">Save</button>
                <button id="sign-out" type="button">Sign out</button>
              </div>
            </form>
            <p class="account__error" id="project-error" role="alert"></p>
            <ul class="projects" id="project-list" aria-label="Projects saved for this email"></ul>
          </div>
        </div>
      </div>
    </div>

    <div class="dock" id="controls">
      <div class="dock__row">
        <label class="scene">
          <span class="sr-only">Scene</span>
          <select id="scene"></select>
        </label>
        <div class="kit" id="kit" role="tablist" aria-label="What to fling"></div>
      </div>
      <div class="loadout" id="presets" role="radiogroup" aria-label="Body to fling"></div>
    </div>

    <div class="sr-only">
      <span id="scale-readout">1 AU</span>
      <span id="brush">Earth</span>
      <label for="time-scale">Time scale</label>
      <input id="time-scale" type="range" min="0" max="1000" step="1" value="500" />
      <output id="time-value" for="time-scale">20 days / sec</output>
    </div>

    <script type="module" src="./orbit.js"></script>
  </body>
</html>
